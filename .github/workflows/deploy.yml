name: Deploy admin web

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-admin-web
  cancel-in-progress: true

env:
  TARGET_DIR: /www/wwwroot/st.wsh1798.cn
  ARCHIVE_NAME: admin-dist.tar.gz
  BACKEND_PORT: 9090

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build:prod

      - name: Pack dist
        run: tar -czf "$ARCHIVE_NAME" -C dist .

      - name: Upload dist archive
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: ${{ secrets.SERVER_PORT || '22' }}
          source: ${{ env.ARCHIVE_NAME }}
          target: /tmp
          overwrite: true

      - name: Publish admin web
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: ${{ secrets.SERVER_PORT || '22' }}
          script_stop: false
          script: |
            set -e

            TARGET_DIR="${{ env.TARGET_DIR }}"
            ARCHIVE="/tmp/${{ env.ARCHIVE_NAME }}"

            if [ ! -f "$ARCHIVE" ]; then
              echo "Archive not found: $ARCHIVE"
              exit 1
            fi

            mkdir -p "$TARGET_DIR"
            find "$TARGET_DIR" -mindepth 1 -maxdepth 1 ! -name ".user.ini" -exec rm -rf {} +
            tar -xzf "$ARCHIVE" -C "$TARGET_DIR"
            rm -f "$ARCHIVE"
            chown -R www:www "$TARGET_DIR" 2>/dev/null || true

            CONF="/www/server/panel/vhost/nginx/st.wsh1798.cn.conf"
            BACKEND_PORT="${{ env.BACKEND_PORT }}"
            if [ -f "$CONF" ]; then
              BLOCK_FILE="$(mktemp)"
              cat > "$BLOCK_FILE" <<EOF
                # codex-prod-api-proxy-start
                location ^~ /prod-api/ {
                    proxy_set_header Host \$host;
                    proxy_set_header X-Real-IP \$remote_addr;
                    proxy_set_header X-Forwarded-For \$proxy_add_x_forwarded_for;
                    proxy_set_header X-Forwarded-Proto \$scheme;
                    proxy_pass http://127.0.0.1:$BACKEND_PORT/;
                }
                # codex-prod-api-proxy-end
            EOF
              sed -i '/# codex-prod-api-proxy-start/,/# codex-prod-api-proxy-end/d' "$CONF"
              TMP_CONF="$(mktemp)"
              awk -v block="$(cat "$BLOCK_FILE")" '
                { lines[NR] = $0 }
                END {
                  last = 0
                  for (i = NR; i >= 1; i--) {
                    if (lines[i] ~ /^}/) { last = i; break }
                  }
                  for (i = 1; i <= NR; i++) {
                    if (i == last) print block
                    print lines[i]
                  }
                }
              ' "$CONF" > "$TMP_CONF"
              cat "$TMP_CONF" > "$CONF"
              rm -f "$BLOCK_FILE" "$TMP_CONF"

              SPA_BLOCK_FILE="$(mktemp)"
              cat > "$SPA_BLOCK_FILE" <<EOF
                # codex-admin-spa-start
                location / {
                    try_files \$uri \$uri/ /index.html;
                }
                # codex-admin-spa-end
            EOF
              PYTHON_BIN="$(command -v python3 || command -v python || true)"
              if [ -z "$PYTHON_BIN" ]; then
                echo "python3/python command not found on server"
                exit 1
              fi
              "$PYTHON_BIN" - "$CONF" "$SPA_BLOCK_FILE" <<'PY'
            import re
            import sys
            from pathlib import Path

            conf = Path(sys.argv[1])
            block_file = Path(sys.argv[2])
            lines = conf.read_text(encoding="utf-8").splitlines()

            def skip_block(source, start):
                depth = 0
                saw_open = False
                i = start
                while i < len(source):
                    line = source[i]
                    depth += line.count("{") - line.count("}")
                    saw_open = saw_open or "{" in line
                    i += 1
                    if saw_open and depth <= 0:
                        break
                    if not saw_open and line.strip().endswith(";"):
                        break
                return i

            cleaned = []
            i = 0
            while i < len(lines):
                line = lines[i]
                if "# codex-admin-spa-start" in line:
                    i += 1
                    while i < len(lines) and "# codex-admin-spa-end" not in lines[i]:
                        i += 1
                    if i < len(lines):
                        i += 1
                    continue
                if re.match(r"^\s*location\s+/\s*\{", line):
                    i = skip_block(lines, i)
                    continue
                cleaned.append(line)
                i += 1

            block = block_file.read_text(encoding="utf-8").rstrip("\n").splitlines()
            insert_at = len(cleaned)
            for index in range(len(cleaned) - 1, -1, -1):
                if cleaned[index].strip() == "}":
                    insert_at = index
                    break
            cleaned[insert_at:insert_at] = block
            conf.write_text("\n".join(cleaned) + "\n", encoding="utf-8")
            PY
              rm -f "$SPA_BLOCK_FILE"
            fi

            if command -v nginx >/dev/null 2>&1; then
              nginx -t && (systemctl reload nginx 2>/dev/null || service nginx reload 2>/dev/null || true)
            fi
