name: Deploy admin web

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-admin-web
  cancel-in-progress: true

env:
  TARGET_DIR: /www/wwwroot/glht.oksja.cn
  ARCHIVE_NAME: admin-dist.tar.gz

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build:prod

      - name: Pack dist
        run: tar -czf "$ARCHIVE_NAME" -C dist .

      - name: Upload dist archive
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: ${{ secrets.SERVER_PORT || '22' }}
          source: ${{ env.ARCHIVE_NAME }}
          target: /tmp
          overwrite: true

      - name: Publish admin web
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: ${{ secrets.SERVER_PORT || '22' }}
          script_stop: true
          script: |
            set -e

            TARGET_DIR="${{ env.TARGET_DIR }}"
            ARCHIVE="/tmp/${{ env.ARCHIVE_NAME }}"

            if [ ! -f "$ARCHIVE" ]; then
              echo "Archive not found: $ARCHIVE"
              exit 1
            fi

            mkdir -p "$TARGET_DIR"
            find "$TARGET_DIR" -mindepth 1 -maxdepth 1 ! -name ".user.ini" -exec rm -rf {} +
            tar -xzf "$ARCHIVE" -C "$TARGET_DIR"
            rm -f "$ARCHIVE"
            chown -R www:www "$TARGET_DIR" 2>/dev/null || true

            CONF="/www/server/panel/vhost/nginx/glht.oksja.cn.conf"
            if [ -f "$CONF" ]; then
              BLOCK_FILE="$(mktemp)"
              cat > "$BLOCK_FILE" <<'EOF'
                # codex-prod-api-proxy-start
                location ^~ /prod-api/ {
                    proxy_set_header Host $host;
                    proxy_set_header X-Real-IP $remote_addr;
                    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                    proxy_set_header X-Forwarded-Proto $scheme;
                    proxy_pass http://127.0.0.1:8080/;
                }
                # codex-prod-api-proxy-end
            EOF
              sed -i '/# codex-prod-api-proxy-start/,/# codex-prod-api-proxy-end/d' "$CONF"
              TMP_CONF="$(mktemp)"
              awk -v block="$(cat "$BLOCK_FILE")" '
                { lines[NR] = $0 }
                END {
                  last = 0
                  for (i = NR; i >= 1; i--) {
                    if (lines[i] ~ /^}/) { last = i; break }
                  }
                  for (i = 1; i <= NR; i++) {
                    if (i == last) print block
                    print lines[i]
                  }
                }
              ' "$CONF" > "$TMP_CONF"
              cat "$TMP_CONF" > "$CONF"
              rm -f "$BLOCK_FILE" "$TMP_CONF"
            fi

            if command -v nginx >/dev/null 2>&1; then
              nginx -t && (systemctl reload nginx 2>/dev/null || service nginx reload 2>/dev/null || true)
            fi
