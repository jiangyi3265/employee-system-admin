name: Server hotfix

on:
  workflow_dispatch:

jobs:
  apply:
    runs-on: ubuntu-latest

    steps:
      - name: Apply server proxy config
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: ${{ secrets.SERVER_PORT || '22' }}
          script_stop: false
          command_timeout: 5m
          script: |
            set -e
            BACKEND_PORT=9090

            insert_block_before_last_brace() {
              conf="$1"
              start_marker="$2"
              end_marker="$3"
              block_file="$4"

              if [ ! -f "$conf" ]; then
                echo "nginx config not found: $conf"
                return 0
              fi

              python_bin="$(command -v python3 || command -v python || true)"
              if [ -z "$python_bin" ]; then
                echo "python3/python command not found"
                exit 1
              fi
              "$python_bin" - "$conf" "$start_marker" "$end_marker" "$block_file" <<'PY'
            from pathlib import Path
            import sys

            conf = Path(sys.argv[1])
            start_marker = sys.argv[2]
            end_marker = sys.argv[3]
            block_file = Path(sys.argv[4])

            lines = conf.read_text(encoding="utf-8").splitlines()
            cleaned = []
            skipping = False
            for line in lines:
                if start_marker in line:
                    skipping = True
                    continue
                if skipping:
                    if end_marker in line:
                        skipping = False
                    continue
                cleaned.append(line)

            block = block_file.read_text(encoding="utf-8").rstrip("\n").splitlines()
            insert_at = len(cleaned)
            for index in range(len(cleaned) - 1, -1, -1):
                if cleaned[index].strip() == "}":
                    insert_at = index
                    break

            cleaned[insert_at:insert_at] = block
            conf.write_text("\n".join(cleaned) + "\n", encoding="utf-8")
            PY
            }

            admin_block="$(mktemp)"
            cat > "$admin_block" <<EOF
                # codex-prod-api-proxy-start
                location ^~ /prod-api/ {
                    proxy_set_header Host \$host;
                    proxy_set_header X-Real-IP \$remote_addr;
                    proxy_set_header X-Forwarded-For \$proxy_add_x_forwarded_for;
                    proxy_set_header X-Forwarded-Proto \$scheme;
                    proxy_pass http://127.0.0.1:$BACKEND_PORT/;
                }
                # codex-prod-api-proxy-end
            EOF

            frontend_block="$(mktemp)"
            cat > "$frontend_block" <<EOF
                # codex-sqms-proxy-start
                location ^~ /sqms/ {
                    proxy_set_header Host \$host;
                    proxy_set_header X-Real-IP \$remote_addr;
                    proxy_set_header X-Forwarded-For \$proxy_add_x_forwarded_for;
                    proxy_set_header X-Forwarded-Proto \$scheme;
                    proxy_pass http://127.0.0.1:$BACKEND_PORT;
                }
                # codex-sqms-proxy-end
            EOF

            insert_block_before_last_brace "/www/server/panel/vhost/nginx/st.wsh1798.cn.conf" "codex-prod-api-proxy-start" "codex-prod-api-proxy-end" "$admin_block"
            insert_block_before_last_brace "/www/server/panel/vhost/nginx/www.wsh1798.cn.conf" "codex-sqms-proxy-start" "codex-sqms-proxy-end" "$frontend_block"
            rm -f "$admin_block" "$frontend_block"

            spa_block="$(mktemp)"
            cat > "$spa_block" <<EOF
                # codex-admin-spa-start
                location / {
                    try_files \$uri \$uri/ /index.html;
                }
                # codex-admin-spa-end
            EOF
            python_bin="$(command -v python3 || command -v python || true)"
            if [ -z "$python_bin" ]; then
              echo "python3/python command not found"
              exit 1
            fi
            "$python_bin" - "/www/server/panel/vhost/nginx/st.wsh1798.cn.conf" "$spa_block" <<'PY'
            from pathlib import Path
            import re
            import sys

            conf = Path(sys.argv[1])
            block_file = Path(sys.argv[2])
            if not conf.exists():
                raise SystemExit(0)

            lines = conf.read_text(encoding="utf-8").splitlines()

            def skip_block(source, start):
                depth = 0
                saw_open = False
                i = start
                while i < len(source):
                    line = source[i]
                    depth += line.count("{") - line.count("}")
                    saw_open = saw_open or "{" in line
                    i += 1
                    if saw_open and depth <= 0:
                        break
                    if not saw_open and line.strip().endswith(";"):
                        break
                return i

            cleaned = []
            i = 0
            while i < len(lines):
                line = lines[i]
                if "# codex-admin-spa-start" in line:
                    i += 1
                    while i < len(lines) and "# codex-admin-spa-end" not in lines[i]:
                        i += 1
                    if i < len(lines):
                        i += 1
                    continue
                if re.match(r"^\s*location\s+/\s*\{", line):
                    i = skip_block(lines, i)
                    continue
                cleaned.append(line)
                i += 1

            block = block_file.read_text(encoding="utf-8").rstrip("\n").splitlines()
            insert_at = len(cleaned)
            for index in range(len(cleaned) - 1, -1, -1):
                if cleaned[index].strip() == "}":
                    insert_at = index
                    break
            cleaned[insert_at:insert_at] = block
            conf.write_text("\n".join(cleaned) + "\n", encoding="utf-8")
            PY
            rm -f "$spa_block"

            if [ -d "/www/wwwroot/www.wsh1798.cn" ]; then
              grep -Rsl "http://localhost:8080" "/www/wwwroot/www.wsh1798.cn" | while IFS= read -r file; do
                sed -i 's#http://localhost:8080##g' "$file"
                echo "patched frontend api base in $file"
              done
            fi

            nginx -t
            systemctl reload nginx 2>/dev/null || service nginx reload 2>/dev/null || true

            echo "backend_service=$(systemctl is-active ruoyi-admin 2>/dev/null || true)"
            echo "backend_http=$(curl -s -o /dev/null -w '%{http_code}' --max-time 8 http://127.0.0.1:$BACKEND_PORT/ || true)"
